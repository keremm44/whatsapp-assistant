[pytest]
testpaths =
    tests/unit
python_files = test_*.py
pythonpath = .
addopts = --strict-markers
norecursedirs =
    venv
    .venv
    __pycache__
    .git
    .pytest_cache
markers =
    integration: Gerçek Supabase/veritabanı kullanan senaryolar
    live: Çalışan API veya gerçek kimlik doğrulama kullanan kontroller
    stress: Yüksek hacimli mesaj senaryoları
